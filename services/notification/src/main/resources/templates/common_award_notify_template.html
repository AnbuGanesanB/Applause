<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Team Award Notification</title>

    <style>
    body { margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; background:#f4f4f4; }
    .container { width:100%; padding:20px 0; }
    .card { max-width:600px; margin:0 auto; background:#ffffff; border-radius:6px; overflow:hidden; }
    .header { padding:18px 24px; background:#0b66c3; color:#ffffff; }
    .header h1 { margin:0; font-size:18px; font-weight:600; }
    .body { padding:24px; color:#333; font-size:15px; line-height:1.5; }
    .award-box { border:1px solid #e6e6e6; border-radius:6px; padding:16px; background:#fafafa; margin-top:16px; }
    .label { font-size:12px; color:#777; }
    .award-title { font-size:18px; font-weight:700; color:#0b66c3; margin:6px 0; }
    .points { display:inline-block; margin-top:6px; padding:8px 12px; border-radius:20px; background:#eaf4ff; color:#0b66c3; font-weight:700; }
    .footer { padding:16px 24px; font-size:12px; color:#999; text-align:center; }
  </style>
</head>

<body>
<!-- Expected variables:
     ${teamName}
     ${award.name}
     ${award.points}
-->

<table role="presentation" cellpadding="0" cellspacing="0" width="100%" class="container">
    <tr>
        <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" width="100%" class="card">

                <tr>
                    <td class="header">
                        <h1>Company Name</h1>
                    </td>
                </tr>

                <tr>
                    <td class="body">

                        <p>Hello <span th:text="${teamName}">Team</span> Team,</p>
                        <p>Congrats for <span th:text="${award.name}">Award Name</span>.</p>
                        <p>You will be credited <span th:text="${award.points}">100</span> points each.</p>

                        <div class="award-box">
                            <span class="label">Award</span>
                            <div class="award-title" th:text="${award.name}">Award Name</div>

                            <span class="label">Reward Points per Member</span>
                            <div class="points" th:text="${award.points}">100</div>
                        </div>

                    </td>
                </tr>

                <tr>
                    <td class="footer">
                        Company Name<br/>
                        Company Address<br/>
                        Automated notification. Do not reply.
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
